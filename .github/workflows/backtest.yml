name: Backtest momentum

on:
  workflow_dispatch:
    inputs:
      refrescar:
        description: "Volver a descargar datos (sí/no)"
        default: "sí"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Correr backtest
        run: python run_backtest.py ${{ inputs.refrescar == 'sí' && '--refrescar' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: reporte-backtest
          path: backtest/reporte/
