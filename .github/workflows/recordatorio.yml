name: Recordatorio revisión viajes

on:
  schedule:
    - cron: "0 12 27 11 *"   # 27 de noviembre, 12:00 UTC (9:00 en Chile)
  workflow_dispatch:          # para probarlo a mano

jobs:
  recordar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enviar recordatorio con el CSV adjunto
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python - << 'PY'
          import csv, os, smtplib
          from datetime import date
          from email.message import EmailMessage

          if date.today().year != 2026 and os.environ["MANUAL"] != "true":
              raise SystemExit("Recordatorio de 2026 ya enviado; no se repite.")

          ruta = "viajes/data/viajes.csv"
          filas = list(csv.DictReader(open(ruta, encoding="utf-8"))) if os.path.exists(ruta) else []
          lecturas = sum(f["tipo"] == "lectura" for f in filas)
          umbral = {"chile": 0.015, "buda-ext": 0.015, "referencia": 0.03, "extranjero": 0.02}
          sobre = {}
          for f in filas:
              if f["tipo"] in umbral and f["neto"] and float(f["neto"]) >= umbral[f["tipo"]]:
                  sobre[f["tipo"]] = sobre.get(f["tipo"], 0) + 1
          detalle = "\n".join(f"  - {k}: {v}" for k, v in sobre.items()) or "  - ninguna"

          msg = EmailMessage()
          u = os.environ["GMAIL_USER"]
          msg["Subject"] = "⏰ Revisión del escáner de viajes: pásale el CSV a Claude"
          msg["From"], msg["To"] = u, os.environ.get("MAIL_TO") or u
          msg.set_content(
              "Pasaron ~4 semanas desde que dejaste corriendo el escáner de viajes.\n\n"
              f"Lecturas registradas: {lecturas}\n"
              f"Rutas sobre el umbral (veces):\n{detalle}\n\n"
              "Adjunto va viajes.csv. Súbelo a Claude para analizar cuántas oportunidades "
              "aparecieron, de qué tamaño y cuánto duraron.")
          if filas:
              msg.add_attachment(open(ruta, "rb").read(), maintype="text",
                                 subtype="csv", filename="viajes.csv")
          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as s:
              s.login(u, os.environ["GMAIL_APP_PASSWORD"])
              s.send_message(msg)
          print("Recordatorio enviado.")
          PY
