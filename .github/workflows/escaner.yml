name: Escáner de arbitraje

on:
  schedule:
    - cron: "*/15 * * * *"   # cada 15 min (GitHub puede atrasarlo varios minutos)
  workflow_dispatch:          # botón para correrlo a mano

permissions:
  contents: write             # para commitear el historial

concurrency:
  group: escaner
  cancel-in-progress: false

jobs:
  escanear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Escanear spreads
        run: python scanner.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}   # opcional; si no existe, se envía a GMAIL_USER

      - name: Guardar historial
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/spreads.csv
          git diff --cached --quiet || git commit -m "Lecturas $(date -u +%FT%TZ)"
          git push
