name: Análisis eRank

on:
  push:
    paths:
      - "nichos/erank/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analizar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nichos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Analizar exports
        run: python analizar_erank.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
      - name: Guardar historial y ranking
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/erank_*.csv data/erank_procesados.txt 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Ranking eRank $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
