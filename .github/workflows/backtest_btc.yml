name: Backtest tendencia BTC

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tendencia_btc.py
      - uses: actions/upload-artifact@v4
        with:
          name: reporte-btc
          path: backtest/reporte_btc/
