name: Escáner de viajes

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: viajes
  cancel-in-progress: false

jobs:
  escanear:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: viajes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Diagnóstico DNS
        run: |
          for h in www.buda.com www.cryptomkt.com; do
            getent hosts $h > /dev/null && echo "OK   $h" || echo "FALLA $h"
          done
      - name: Escanear
        run: python viajes.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
      - name: Guardar historial
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/viajes.csv
          git diff --cached --quiet && exit 0
          git commit -m "Viajes $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
